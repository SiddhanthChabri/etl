services:
  db:
    image: postgres:15-alpine
    container_name: retail_db
    restart: unless-stopped
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: "12345"
      POSTGRES_DB: retail_dw
    volumes:
      - pgdata:/var/lib/postgresql/data
    expose:
      - "5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - etl_network

  app:
    build: .
    image: retail_analytics:latest
    container_name: retail_analytics
    restart: unless-stopped
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_HOST: db
      DB_PORT: "5432"
      DB_USER: postgres
      DB_PASSWORD: "12345"
      DB_NAME: retail_dw
    ports:
      - "8888:8000"
    volumes:
      - ~/.kaggle/kaggle.json:/root/.kaggle/kaggle.json:ro
      # Mount results so they persist across restarts
      - ./models:/app/models
    command: ["python", "run_all.py"]
    networks:
      - etl_network

volumes:
  pgdata:

networks:
  etl_network:
    driver: bridge
