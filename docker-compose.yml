version: "3.9"

services:
  db:
    image: postgres:15-alpine
    container_name: retail_db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: "12345"
      POSTGRES_DB: retail_dw
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build: .
    container_name: retail_analytics
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_HOST: db
      DB_PORT: "5432"
      DB_USER: postgres
      DB_PASSWORD: "12345"
      DB_NAME: retail_dw
    ports:
      - "8000:8000"
    volumes:
      # Mount results so they persist across restarts
      - ./models:/app/models
    command: ["python", "run_all.py"]

volumes:
  pgdata:
